<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RoomChat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0f;
      --surface: #12121a;
      --card:    #1a1a26;
      --border:  #2a2a3d;
      --accent:  #ff4d6d;
      --accent2: #4dffc3;
      --text:    #e8e8f0;
      --muted:   #6b6b88;
      --mono:    'Space Mono', monospace;
      --sans:    'Syne', sans-serif;
      --r:       12px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .4;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }

    /* ── SCREENS ── */
    .screen { display: none; position: relative; z-index: 1; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
    .screen.active { display: flex; }

    /* ── TYPOGRAPHY ── */
    .logo { font-size: clamp(48px, 10vw, 88px); font-weight: 800; letter-spacing: -3px; line-height: 1; }
    .logo span { color: var(--accent); }
    .tagline { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; margin-top: 10px; }

    /* ── FORMS ── */
    .form-card {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 20px;
      padding: 32px; width: 100%; max-width: 380px;
      display: flex; flex-direction: column; gap: 16px; animation: slideUp .25s ease;
    }
    .form-card h3 { font-size: 20px; font-weight: 800; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
    .field input {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r);
      padding: 12px 16px; font-family: var(--mono); font-size: 14px; color: var(--text);
      outline: none; transition: border-color .2s; width: 100%;
    }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--muted); }

    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1; }

    /* ── BUTTONS ── */
    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1; padding: 13px; border-radius: var(--r); border: none; cursor: pointer;
      font-family: var(--sans); font-size: 14px; font-weight: 600;
      transition: transform .15s, opacity .15s;
    }
    .btn:hover  { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); opacity: .8; }
    .btn-primary   { background: var(--accent);  color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
    .btn-teal      { background: var(--accent2); color: #0a0a0f; }
    .btn-sm        { flex: unset; padding: 8px 16px; font-size: 13px; }

    .back-link { font-family: var(--mono); font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; background: none; border: none; }
    .back-link:hover { color: var(--text); }

    .error-text { font-family: var(--mono); font-size: 12px; color: var(--accent); display: none; min-height: 16px; }
    .switch-text { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }
    .switch-text span { color: var(--accent2); cursor: pointer; text-decoration: underline; }

    /* ── LANDING ── */
    #landing { flex-direction: column; gap: 40px; text-align: center; }
    .landing-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
    .landing-btns .btn { flex: unset; width: 100%; padding: 16px; font-size: 15px; }

    /* ── DASHBOARD ── */
    #dashboard { flex-direction: column; align-items: center; padding: 32px; }
    .dashboard-inner { width: 100%; max-width: 460px; }
    .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .dash-title  { font-size: 24px; font-weight: 800; }
    .dash-sub    { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 24px; }

    .room-card {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 16px;
      padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; transition: border-color .2s, transform .15s;
    }
    .room-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .room-card-id   { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--accent2); letter-spacing: 3px; }
    .room-card-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .room-card-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }

    #no-rooms { display: none; text-align: center; padding: 40px 0; font-family: var(--mono); font-size: 13px; color: var(--muted); }
    .dash-actions { display: flex; gap: 12px; margin-top: 20px; }
    .loading-text { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; padding: 20px; }

    /* ── ROOM CREATED ── */
    .room-created-card {
      background: var(--card); border: 1.5px solid var(--accent2); border-radius: 20px;
      padding: 32px; width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 16px;
      animation: slideUp .25s ease; text-align: center;
    }
    .room-created-card h3 { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
    .big-room-id { font-family: var(--mono); font-size: 44px; font-weight: 700; color: var(--accent2); letter-spacing: 8px; }

    /* ── CHAT ── */
    #chat { flex-direction: column; align-items: stretch; padding: 0; height: 100vh; }

    .chat-header {
      background: var(--surface); border-bottom: 1.5px solid var(--border);
      padding: 14px 20px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; position: relative; z-index: 2; flex-shrink: 0;
    }
    .room-badge   { display: flex; align-items: center; gap: 10px; }
    .room-dot     { width: 9px; height: 9px; background: var(--accent2); border-radius: 50%; box-shadow: 0 0 8px var(--accent2); animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    .room-id-label { font-family: var(--mono); font-size: 10px; color: var(--muted); }
    .room-name-val { font-size: 15px; font-weight: 700; }
    .room-id-small { font-family: var(--mono); font-size: 11px; color: var(--accent2); letter-spacing: 1px; }

    .header-right  { display: flex; align-items: center; gap: 8px; }
    .user-chip     { font-family: var(--mono); font-size: 11px; background: var(--card); border: 1.5px solid var(--border); border-radius: 100px; padding: 5px 12px; color: var(--text); }
    .icon-btn      { width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); transition: border-color .2s, color .2s; }
    .icon-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── MEMBERS PANEL ── */
    #members-panel {
      display: none; position: fixed; top: 64px; right: 16px; z-index: 100;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 16px; padding: 18px; min-width: 210px; animation: slideUp .2s ease;
    }
    .members-label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-bottom: 12px; }
    #members-list  { display: flex; flex-direction: column; gap: 8px; }
    .member-chip   { font-family: var(--mono); font-size: 12px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 100px; padding: 6px 14px; color: var(--text); }

    /* ── TYPING INDICATOR ── */
    #typing-bar {
      padding: 4px 24px 0;
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      min-height: 20px; flex-shrink: 0;
    }

    /* ── MESSAGES ── */
    .messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg { display: flex; flex-direction: column; gap: 4px; max-width: 68%; animation: slideUp .18s ease; }
    .msg.self   { align-self: flex-end;   align-items: flex-end; }
    .msg.other  { align-self: flex-start; align-items: flex-start; }
    .msg.system { align-self: center;     align-items: center; max-width: 100%; }

    .msg-author { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 1px; }

    .msg-bubble {
      padding: 10px 14px; border-radius: 16px; font-size: 14px;
      line-height: 1.55; word-break: break-word; position: relative;
    }
    .msg.self  .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.other .msg-bubble { background: var(--card); border: 1.5px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.system .msg-bubble { background: transparent; border: 1.5px dashed var(--border); color: var(--muted); font-family: var(--mono); font-size: 11px; border-radius: 100px; padding: 5px 14px; }

    /* ── REACTIONS ── */
    .msg-reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .reaction-pill {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 100px;
      padding: 2px 8px; font-size: 12px; cursor: pointer; transition: border-color .15s;
      display: flex; align-items: center; gap: 4px;
    }
    .reaction-pill:hover { border-color: var(--accent2); }
    .reaction-pill.mine  { border-color: var(--accent); }

    .react-btn {
      background: none; border: 1.5px dashed var(--border); border-radius: 100px;
      padding: 2px 8px; font-size: 12px; color: var(--muted); cursor: pointer;
      transition: border-color .15s, color .15s; margin-top: 4px;
    }
    .react-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    .emoji-picker {
      position: absolute; bottom: calc(100% + 6px);
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 8px; display: none;
      flex-wrap: wrap; gap: 4px; width: 160px; z-index: 10;
    }
    .msg.self  .emoji-picker { right: 0; }
    .msg.other .emoji-picker { left: 0; }
    .emoji-picker.open { display: flex; }
    .emoji-opt { font-size: 18px; cursor: pointer; padding: 3px; border-radius: 6px; transition: background .15s; }
    .emoji-opt:hover { background: var(--surface); }

    .delete-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 11px; font-family: var(--mono); padding: 2px 6px;
      border-radius: 4px; transition: color .15s;
    }
    .delete-btn:hover { color: var(--accent); }

    /* load more */
    #load-more-btn {
      align-self: center; background: var(--card); border: 1.5px solid var(--border);
      border-radius: 100px; color: var(--muted); font-family: var(--mono);
      font-size: 12px; padding: 6px 18px; cursor: pointer; transition: border-color .2s;
    }
    #load-more-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── INPUT BAR ── */
    .chat-input-bar { background: var(--surface); border-top: 1.5px solid var(--border); padding: 14px 20px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    #msg-input { flex: 1; background: var(--card); border: 1.5px solid var(--border); border-radius: 100px; padding: 11px 18px; font-family: var(--sans); font-size: 14px; color: var(--text); outline: none; transition: border-color .2s; }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--muted); }
    .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .15s; flex-shrink: 0; }
    .send-btn:hover  { transform: scale(1.08); }
    .send-btn:active { transform: scale(.96); }
    .send-btn svg { fill: #fff; }

    /* ── TOAST ── */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--card); border: 1.5px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 13px; padding: 12px 24px; border-radius: 100px; z-index: 999; transition: transform .3s ease; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── MODAL ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; padding: 28px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 16px; animation: slideUp .2s ease; }
    .modal h3 { font-size: 18px; font-weight: 800; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* ── PAGINATION INFO ── */
    .page-info { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0; }
  </style>
</head>
<body>

<!-- ══ SCREEN 1: LANDING ══ -->
<div id="landing" class="screen active">
  <div style="text-align:center;">
    <div class="logo">Room<span>Chat</span></div>
    <div class="tagline">Real-time group messaging</div>
  </div>
  <div class="landing-btns">
    <button class="btn btn-primary" onclick="showAuth('login')">Sign In</button>
    <button class="btn btn-secondary" onclick="showAuth('register')">Create Account</button>
  </div>
</div>

<!-- ══ SCREEN 2: AUTH ══ -->
<div id="auth-screen" class="screen" style="flex-direction:column; gap:16px;">
  <div class="form-card" id="auth-card">
    <h3 id="auth-title">Sign In</h3>
    <div class="field">
      <label>Username</label>
      <input id="auth-username" type="text" placeholder="your username" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input id="auth-password" type="password" placeholder="••••••••"/>
    </div>
    <span id="auth-error" class="error-text"></span>
    <div class="btn-row">
      <button class="btn btn-primary" id="auth-submit-btn" onclick="submitAuth()">Sign In</button>
    </div>
    <div class="switch-text" id="auth-switch">
      No account? <span onclick="showAuth('register')">Register</span>
    </div>
  </div>
  <button class="back-link" onclick="goTo('landing')">← Back</button>
</div>

<!-- ══ SCREEN 3: DASHBOARD ══ -->
<div id="dashboard" class="screen">
  <div class="dashboard-inner">
    <div class="dash-header">
      <div class="dash-title">My Rooms</div>
      <button class="back-link" onclick="logout()">Sign out</button>
    </div>
    <div class="dash-sub" id="dashboard-sub"></div>
    <div id="rooms-list"></div>
    <div id="no-rooms">🕳️ No rooms yet — create or join one!</div>
    <div class="dash-actions">
      <button class="btn btn-primary" style="flex:1;" onclick="openCreateModal()">+ Create Room</button>
      <button class="btn btn-secondary" style="flex:1;" onclick="openJoinModal()">Join Room</button>
    </div>
  </div>
</div>

<!-- ══ SCREEN 4: ROOM CREATED ══ -->
<div id="created-screen" class="screen" style="flex-direction:column; gap:20px;">
  <div class="room-created-card">
    <h3>Room Created 🎉</h3>
    <div class="big-room-id" id="created-room-id">——</div>
    <p style="font-size:13px; color:var(--muted); font-family:var(--mono);">Share this code with friends</p>
    <button class="btn btn-teal" onclick="enterChat()">Enter Chat →</button>
  </div>
  <button class="back-link" onclick="goTo('dashboard')">← Dashboard</button>
</div>

<!-- ══ SCREEN 5: CHAT ══ -->
<div id="chat" class="screen">
  <div class="chat-header">
    <div class="room-badge">
      <div class="room-dot"></div>
      <div>
        <div class="room-name-val" id="header-room-name">——</div>
        <div class="room-id-small" id="header-room-id">——</div>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="toggleMembers()" title="Members">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      </button>
      <div class="user-chip" id="header-username">——</div>
      <button class="back-link" onclick="leaveChat()">Leave</button>
    </div>
  </div>

  <div class="messages" id="messages"></div>
  <div id="typing-bar"></div>

  <div class="chat-input-bar">
    <input id="msg-input" type="text" placeholder="Type a message…" autocomplete="off"/>
    <button class="send-btn" onclick="sendMessage()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<!-- ══ MEMBERS PANEL ══ -->
<div id="members-panel">
  <div class="members-label">MEMBERS</div>
  <div id="members-list"></div>
</div>

<!-- ══ CREATE ROOM MODAL ══ -->
<div class="modal-overlay" id="create-modal">
  <div class="modal">
    <h3>Create Room</h3>
    <div class="field">
      <label>Room Name</label>
      <input id="create-room-name" type="text" placeholder="e.g. Study Group" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Password (optional)</label>
      <input id="create-room-password" type="password" placeholder="Leave blank for open room"/>
    </div>
    <div class="field">
      <label>Max Users</label>
      <input id="create-max-users" type="number" value="50" min="2" max="200"/>
    </div>
    <span id="create-error" class="error-text"></span>
    <div class="btn-row">
      <button class="btn btn-secondary btn-sm" onclick="closeModal('create-modal')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="createRoom()">Create</button>
    </div>
  </div>
</div>

<!-- ══ JOIN ROOM MODAL ══ -->
<div class="modal-overlay" id="join-modal">
  <div class="modal">
    <h3>Join a Room</h3>
    <div class="field">
      <label>Room ID</label>
      <input id="join-room-id" type="text" placeholder="6-digit room code" maxlength="6" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Password (if required)</label>
      <input id="join-room-password" type="password" placeholder="Leave blank if open"/>
    </div>
    <span id="join-error" class="error-text"></span>
    <div class="btn-row">
      <button class="btn btn-secondary btn-sm" onclick="closeModal('join-modal')">Cancel</button>
      <button class="btn btn-teal btn-sm" onclick="joinRoom()">Join</button>
    </div>
  </div>
</div>

<!-- ══ TOAST ══ -->
<div id="toast"></div>

<script>
const SERVER = 'http://localhost:5000';
const EMOJIS = ['👍','❤️','😂','😮','😢','🔥','👏','🎉'];

let socket          = null;
let currentUser     = '';
let currentRoom     = '';
let currentRoomName = '';
let authToken       = localStorage.getItem('rc_token') || '';
let membersVisible  = false;
let typingTimer     = null;
let typingUsers     = new Set();
let currentPage     = 1;
let hasMore         = false;

// ── INIT ───────────────────────────────────────────────────
window.addEventListener('load', () => {
  const saved = localStorage.getItem('rc_token');
  const user  = localStorage.getItem('rc_user');
  if (saved && user) {
    authToken   = saved;
    currentUser = user;
    openDashboard();
  }
});

// ── UTILS ──────────────────────────────────────────────────
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = isError ? 'var(--accent)' : 'var(--border)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` };
}

function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── AUTH ───────────────────────────────────────────────────
let authMode = 'login';

function showAuth(mode) {
  authMode = mode;
  const isLogin = mode === 'login';
  document.getElementById('auth-title').textContent      = isLogin ? 'Sign In' : 'Create Account';
  document.getElementById('auth-submit-btn').textContent = isLogin ? 'Sign In' : 'Register';
  document.getElementById('auth-switch').innerHTML       = isLogin
    ? 'No account? <span onclick="showAuth(\'register\')">Register</span>'
    : 'Have an account? <span onclick="showAuth(\'login\')">Sign In</span>';
  document.getElementById('auth-error').style.display = 'none';
  goTo('auth-screen');
}

async function submitAuth() {
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl    = document.getElementById('auth-error');

  if (!username || !password) { errEl.textContent = 'Fill in all fields.'; errEl.style.display = 'block'; return; }

  const endpoint = authMode === 'login' ? '/login' : '/register';
  try {
    const res  = await fetch(SERVER + endpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.message; errEl.style.display = 'block'; return; }

    authToken   = data.token;
    currentUser = data.username;
    localStorage.setItem('rc_token', authToken);
    localStorage.setItem('rc_user', currentUser);
    errEl.style.display = 'none';
    openDashboard();
  } catch (e) {
    errEl.textContent = 'Server unreachable.'; errEl.style.display = 'block';
  }
}

function logout() {
  authToken   = '';
  currentUser = '';
  localStorage.removeItem('rc_token');
  localStorage.removeItem('rc_user');
  if (socket) { socket.disconnect(); socket = null; }
  goTo('landing');
}

// ── DASHBOARD ─────────────────────────────────────────────
async function openDashboard() {
  document.getElementById('dashboard-sub').textContent = `@${currentUser}`;
  goTo('dashboard');
  await loadUserRooms();
}

async function loadUserRooms() {
  const list   = document.getElementById('rooms-list');
  const noRoom = document.getElementById('no-rooms');
  list.innerHTML = '<div class="loading-text">Loading rooms...</div>';
  noRoom.style.display = 'none';

  try {
    const res   = await fetch(`${SERVER}/rooms/${currentUser}`, { headers: authHeaders() });
    const rooms = await res.json();
    list.innerHTML = '';

    if (!rooms.length) { noRoom.style.display = 'block'; return; }

    rooms.forEach(room => {
      const card = document.createElement('div');
      card.className = 'room-card';

      const left    = document.createElement('div');
      const nameEl  = document.createElement('div');
      nameEl.className   = 'room-card-name';
      nameEl.textContent = room.room_name || 'Unnamed Room';

      const idEl   = document.createElement('div');
      idEl.className   = 'room-card-id';
      idEl.textContent = room.room_id;

      const metaEl = document.createElement('div');
      metaEl.className   = 'room-card-meta';
      const preview      = room.users.slice(0,3).join(', ') + (room.users.length > 3 ? '...' : '');
      metaEl.textContent = `${room.users.length} member${room.users.length !== 1 ? 's' : ''} · ${preview}`;

      left.appendChild(nameEl);
      left.appendChild(idEl);
      left.appendChild(metaEl);

      const right = document.createElement('div');
      right.style.cssText = 'display:flex; flex-direction:column; gap:6px; align-items:flex-end;';

      const enterBtn = document.createElement('button');
      enterBtn.className   = 'btn btn-primary btn-sm';
      enterBtn.textContent = 'Enter →';
      enterBtn.onclick = () => { currentRoom = room.room_id; currentRoomName = room.room_name || room.room_id; initChat(); };

      const leaveBtn = document.createElement('button');
      leaveBtn.style.cssText = 'font-family:var(--mono); font-size:11px; color:var(--muted); background:none; border:none; cursor:pointer; text-decoration:underline;';
      leaveBtn.textContent = 'leave room';
      leaveBtn.onclick = async (e) => { e.stopPropagation(); await leaveRoomPermanent(room.room_id); };

      right.appendChild(enterBtn);
      right.appendChild(leaveBtn);
      card.appendChild(left);
      card.appendChild(right);
      list.appendChild(card);
    });
  } catch (e) {
    list.innerHTML = '<div class="loading-text" style="color:var(--accent);">Could not load rooms.</div>';
  }
}

async function leaveRoomPermanent(room_id) {
  try {
    await fetch(`${SERVER}/room/${room_id}/leave`, { method: 'POST', headers: authHeaders() });
    showToast('Left room');
    await loadUserRooms();
  } catch (e) {
    showToast('Failed to leave room', true);
  }
}

// ── CREATE ROOM ────────────────────────────────────────────
function openCreateModal() {
  document.getElementById('create-room-name').value     = '';
  document.getElementById('create-room-password').value = '';
  document.getElementById('create-max-users').value     = '50';
  document.getElementById('create-error').style.display = 'none';
  openModal('create-modal');
}

async function createRoom() {
  const room_name = document.getElementById('create-room-name').value.trim();
  const password  = document.getElementById('create-room-password').value;
  const max_users = document.getElementById('create-max-users').value;
  const errEl     = document.getElementById('create-error');

  try {
    const res  = await fetch(`${SERVER}/create`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ room_name, password, max_users })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.message; errEl.style.display = 'block'; return; }

    closeModal('create-modal');
    currentRoom     = data.room_id;
    currentRoomName = data.room_name;
    document.getElementById('created-room-id').textContent = currentRoom;
    goTo('created-screen');
  } catch (e) {
    errEl.textContent = 'Server error.'; errEl.style.display = 'block';
  }
}

function enterChat() { initChat(); }

// ── JOIN ROOM ──────────────────────────────────────────────
function openJoinModal() {
  document.getElementById('join-room-id').value       = '';
  document.getElementById('join-room-password').value = '';
  document.getElementById('join-error').style.display = 'none';
  openModal('join-modal');
}

async function joinRoom() {
  const room_id  = document.getElementById('join-room-id').value.trim();
  const password = document.getElementById('join-room-password').value;
  const errEl    = document.getElementById('join-error');

  if (!room_id) { errEl.textContent = 'Enter a room ID.'; errEl.style.display = 'block'; return; }

  try {
    const res  = await fetch(`${SERVER}/join`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ room_id, password })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.message; errEl.style.display = 'block'; return; }

    closeModal('join-modal');
    currentRoom     = data.room_id;
    currentRoomName = data.room_name;
    initChat();
  } catch (e) {
    errEl.textContent = 'Could not connect to server.'; errEl.style.display = 'block';
  }
}

// ── INIT CHAT ──────────────────────────────────────────────
async function initChat() {
  document.getElementById('header-room-name').textContent = currentRoomName;
  document.getElementById('header-room-id').textContent   = currentRoom;
  document.getElementById('header-username').textContent  = currentUser;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('typing-bar').textContent = '';
  typingUsers.clear();
  currentPage = 1;
  hasMore     = false;
  goTo('chat');

  if (socket) { socket.disconnect(); socket = null; }

  // Load first page of history
  await loadMessages(1);

  // Connect socket
  socket = io(SERVER);

  socket.on('connect', () => {
    socket.emit('join_room', { room_id: currentRoom, user_id: currentUser });
  });

  socket.on('message', (data) => {
    if (typeof data === 'string') {
      appendMessage(null, data, 'system');
    } else {
      appendMessage(data.user, data.message, data.user === currentUser ? 'self' : 'other', data.message_id, data.reactions || {});
    }
  });

  socket.on('message_deleted', ({ message_id }) => {
    const el = document.querySelector(`[data-msg-id="${message_id}"]`);
    if (el) el.closest('.msg').remove();
  });

  socket.on('reaction_updated', ({ message_id, reactions }) => {
    updateReactionsUI(message_id, reactions);
  });

  socket.on('user_typing', ({ user }) => {
    typingUsers.add(user);
    renderTyping();
  });

  socket.on('user_stop_typing', ({ user }) => {
    typingUsers.delete(user);
    renderTyping();
  });

  socket.on('disconnect', () => {
    appendMessage(null, 'Disconnected from server', 'system');
  });

  // Input events
  const old   = document.getElementById('msg-input');
  const fresh = old.cloneNode(true);
  old.replaceWith(fresh);
  fresh.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
  fresh.addEventListener('input', handleTyping);
  fresh.focus();
}

// ── LOAD MESSAGES (paginated) ──────────────────────────────
async function loadMessages(page) {
  try {
    const res  = await fetch(`${SERVER}/messages/${currentRoom}?page=${page}&limit=50`, { headers: authHeaders() });
    const data = await res.json();
    hasMore     = data.has_more;
    currentPage = page;

    const container = document.getElementById('messages');

    // Remove old load-more button
    const oldBtn = document.getElementById('load-more-btn');
    if (oldBtn) oldBtn.remove();

    // If page > 1, prepend (insert before first message)
    const msgs = data.messages;
    if (page > 1) {
      // Insert older messages at top
      msgs.reverse().forEach(m => {
        const el = buildMessage(m.user, m.message, m.user === currentUser ? 'self' : 'other', m._id, m.reactions || {});
        container.insertBefore(el, container.firstChild);
      });
    } else {
      msgs.forEach(m => {
        appendMessage(m.user, m.message, m.user === currentUser ? 'self' : 'other', m._id, m.reactions || {});
      });
      if (msgs.length > 0) {
        appendMessage(null, `── ${data.total} message${data.total !== 1 ? 's' : ''} in this room ──`, 'system');
      }
      container.scrollTop = container.scrollHeight;
    }

    // Add load-more button at top if more pages
    if (data.has_more) {
      const btn = document.createElement('button');
      btn.id          = 'load-more-btn';
      btn.textContent = '↑ Load older messages';
      btn.onclick     = () => loadMessages(currentPage + 1);
      container.insertBefore(btn, container.firstChild);
    }
  } catch (e) {
    console.error('Failed to load messages:', e);
  }
}

// ── LEAVE CHAT ─────────────────────────────────────────────
function leaveChat() {
  if (socket) {
    socket.emit('leave_room', { room_id: currentRoom, user_id: currentUser });
    socket.disconnect();
    socket = null;
  }
  goTo('dashboard');
  loadUserRooms();
}

// ── SEND MESSAGE ───────────────────────────────────────────
function sendMessage() {
  const input = document.getElementById('msg-input');
  const msg   = input.value.trim();
  if (!msg || !socket) return;

  socket.emit('send_message', { room_id: currentRoom, user_id: currentUser, message: msg });
  socket.emit('stop_typing',  { room_id: currentRoom, user_id: currentUser });
  clearTimeout(typingTimer);

  input.value = '';
  input.focus();
}

// ── TYPING ─────────────────────────────────────────────────
function handleTyping() {
  if (!socket) return;
  socket.emit('typing', { room_id: currentRoom, user_id: currentUser });
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    socket.emit('stop_typing', { room_id: currentRoom, user_id: currentUser });
  }, 2000);
}

function renderTyping() {
  const bar   = document.getElementById('typing-bar');
  const users = [...typingUsers];
  if (!users.length) { bar.textContent = ''; return; }
  const names = users.slice(0, 2).join(', ');
  bar.textContent = users.length === 1 ? `${names} is typing...` : `${names} are typing...`;
}

// ── BUILD / APPEND MESSAGE ─────────────────────────────────
function buildMessage(author, text, type, msgId = null, reactions = {}) {
  const wrap   = document.createElement('div');
  wrap.classList.add('msg', type);

  if (type !== 'system' && author) {
    const a = document.createElement('div');
    a.className   = 'msg-author';
    a.textContent = author;
    wrap.appendChild(a);
  }

  const bubbleWrap = document.createElement('div');
  bubbleWrap.style.position = 'relative';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (msgId) bubble.setAttribute('data-msg-id', msgId);
  bubble.textContent = text;

  // Emoji picker (inside bubble, positioned absolute)
  if (type !== 'system' && msgId) {
    const picker = document.createElement('div');
    picker.className = 'emoji-picker';
    picker.id = `picker-${msgId}`;
    EMOJIS.forEach(em => {
      const opt = document.createElement('span');
      opt.className   = 'emoji-opt';
      opt.textContent = em;
      opt.onclick = (e) => { e.stopPropagation(); sendReaction(msgId, em, wrap.dataset.roomId); picker.classList.remove('open'); };
      picker.appendChild(opt);
    });
    bubble.appendChild(picker);
  }

  bubbleWrap.appendChild(bubble);
  wrap.appendChild(bubbleWrap);

  // Reactions row
  if (type !== 'system' && msgId) {
    const reactRow = document.createElement('div');
    reactRow.className = 'msg-reactions';
    reactRow.id = `reactions-${msgId}`;
    renderReactionPills(reactRow, reactions, msgId);
    wrap.appendChild(reactRow);

    // React + delete buttons row
    const actRow = document.createElement('div');
    actRow.style.cssText = 'display:flex; gap:6px; align-items:center;';

    const reactBtn = document.createElement('button');
    reactBtn.className   = 'react-btn';
    reactBtn.textContent = '+ react';
    reactBtn.onclick = (e) => {
      e.stopPropagation();
      // Close all other pickers
      document.querySelectorAll('.emoji-picker.open').forEach(p => p.classList.remove('open'));
      document.getElementById(`picker-${msgId}`)?.classList.toggle('open');
    };
    actRow.appendChild(reactBtn);

    // Delete button (only own messages)
    if (author === currentUser) {
      const delBtn = document.createElement('button');
      delBtn.className   = 'delete-btn';
      delBtn.textContent = '✕ delete';
      delBtn.onclick = () => deleteMessage(msgId);
      actRow.appendChild(delBtn);
    }

    wrap.appendChild(actRow);
  }

  return wrap;
}

function appendMessage(author, text, type, msgId = null, reactions = {}) {
  const container = document.getElementById('messages');
  const el = buildMessage(author, text, type, msgId, reactions);
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

// ── REACTIONS ──────────────────────────────────────────────
function renderReactionPills(container, reactions, msgId) {
  container.innerHTML = '';
  Object.entries(reactions).forEach(([emoji, users]) => {
    if (!users.length) return;
    const pill = document.createElement('span');
    pill.className = 'reaction-pill' + (users.includes(currentUser) ? ' mine' : '');
    pill.textContent = `${emoji} ${users.length}`;
    pill.onclick = () => sendReaction(msgId, emoji);
    container.appendChild(pill);
  });
}

function updateReactionsUI(msgId, reactions) {
  const row = document.getElementById(`reactions-${msgId}`);
  if (row) renderReactionPills(row, reactions, msgId);
}

async function sendReaction(msgId, emoji) {
  try {
    await fetch(`${SERVER}/messages/${msgId}/react`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ emoji })
    });
  } catch (e) {
    showToast('Reaction failed', true);
  }
}

// ── DELETE MESSAGE ─────────────────────────────────────────
async function deleteMessage(msgId) {
  try {
    const res = await fetch(`${SERVER}/messages/${msgId}`, {
      method: 'DELETE', headers: authHeaders()
    });
    if (!res.ok) { const d = await res.json(); showToast(d.message, true); }
  } catch (e) {
    showToast('Delete failed', true);
  }
}

// ── MEMBERS PANEL ──────────────────────────────────────────
async function toggleMembers() {
  const panel = document.getElementById('members-panel');
  if (membersVisible) { panel.style.display = 'none'; membersVisible = false; return; }

  try {
    const res  = await fetch(`${SERVER}/room/${currentRoom}`, { headers: authHeaders() });
    const data = await res.json();
    const list = document.getElementById('members-list');
    list.innerHTML = '';

    data.users.forEach(user => {
      const chip = document.createElement('div');
      chip.className   = 'member-chip';
      chip.textContent = `${user === currentUser ? '🟢' : '⚪'} ${user}${user === data.created_by ? ' 👑' : ''}`;
      list.appendChild(chip);
    });

    panel.style.display = 'block';
    membersVisible = true;
  } catch (e) {
    showToast('Could not load members', true);
  }
}

document.addEventListener('click', (e) => {
  if (membersVisible &&
      !document.getElementById('members-panel').contains(e.target) &&
      !e.target.closest('.icon-btn')) {
    document.getElementById('members-panel').style.display = 'none';
    membersVisible = false;
  }
  // Close emoji pickers on outside click
  if (!e.target.closest('.emoji-picker') && !e.target.closest('.react-btn')) {
    document.querySelectorAll('.emoji-picker.open').forEach(p => p.classList.remove('open'));
  }
});
</script>
